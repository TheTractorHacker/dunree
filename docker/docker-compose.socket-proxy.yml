# Opt-in override: lets Zoraxy list Docker containers and networks without
# giving it the Docker socket.
#
#   docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml up -d
#
# Only the proxy container touches /var/run/docker.sock, and it only forwards
# GET requests for the endpoints Zoraxy uses (containers, networks, plus the
# version/ping calls the Docker client makes). Everything else, including every
# POST/PUT/DELETE (create, start, exec, ...), is rejected by the proxy.
services:
  zoraxy:
    environment:
      DOCKER_HOST: "tcp://docker-socket-proxy:2375"
    depends_on:
      - docker-socket-proxy
    networks:
      - default
      - docker-socket

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: zoraxy-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-socket
    # No "ports:" on purpose. The proxy must never be published on the host.

networks:
  docker-socket:
    internal: true
