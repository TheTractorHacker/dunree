# The image name is a variable: there is no default registry (see packaging/README.md). Build one with
#   docker build -t dunree:local -f packaging/container/Dockerfile .     (from the repository root)
# and run:  DUNREE_IMAGE=dunree:local docker compose up -d
services:
  dunree:
    image: ${DUNREE_IMAGE:?set DUNREE_IMAGE to the Dunree image to run}
    container_name: dunree
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp  # HTTP/3 (QUIC) - only needed if QUIC is enabled in Global Settings
      - 8000:8000
    volumes:
      - /path/to/dunree/config/:/opt/dunree/config/
      - /path/to/dunree/plugin/:/opt/dunree/plugin/
      # The Docker socket is NOT mounted by default: read-write access to it is
      # equivalent to root on the host. The container picker ("Docker containers"
      # when adding a proxy rule) only needs to list containers and networks, so
      # enable it through the read-only socket proxy instead:
      #   docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml up -d
      # See README.md ("Docker socket") for details and for the legacy direct mount.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FASTGEOIP: "true"
