<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
    <link rel="stylesheet" href="../script/semantic/semantic.min.css">
    <script src="../script/jquery-3.6.0.min.js"></script>
    <script src="../script/semantic/semantic.min.js"></script>
    <script src="../script/utils.js"></script>
    <style>
        :root {
            --bg-canvas: #f7f8fc;
            --node-proxy-bg: #ffffff;
            --node-proxy-border: #4b75ff;
            --node-upstream-bg: #ffffff;
            --node-upstream-border: #f47847;
            --node-disabled-border: #cccccc;
            --node-disabled-bg: #f3f3f3;
            --text-primary: #222;
            --text-secondary: #666;
            --text-count: #4b75ff;
            --edge-color: #4b75ff;
            --edge-upstream-color: #f47847;
            --internet-fill: #4b75ff;
            --shadow: 0 2px 8px rgba(0,0,0,0.10);
            --active-color: #15803d;
            --strip-bg: #ffffff;
            --pulse-color: #21ba45;
        }

        body.darkTheme {
            --bg-canvas: #1a1a2e;
            --node-proxy-bg: #16213e;
            --node-proxy-border: #4b75ff;
            --node-upstream-bg: #16213e;
            --node-upstream-border: #f7c915;
            --node-disabled-border: #444;
            --node-disabled-bg: #252540;
            --text-primary: #e0e0e0;
            --text-secondary: #aaa;
            --text-count: #7b9fff;
            --edge-color: #4b75ff;
            --edge-upstream-color: #f7c915;
            --internet-fill: #4b75ff;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
            --active-color: #4ade80;
            --strip-bg: #16213e;
            --pulse-color: #4ade80;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-canvas);
            color: var(--text-primary);
        }

        #diagram-wrapper {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 300px;
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            background: var(--bg-canvas);
        }

        #diagram-wrapper.dragging {
            cursor: grabbing;
        }

        /* the grid lives outside the transformed container so panning never re-rasterises it */
        #diagram-pan-container {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* The grid is painted on the wrapper (viewport sized, moved with background-position)
           instead of a 20000 x 20000 px layer that had to be tiled and composited on every pan. */
        #grid-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            will-change: transform;
            background-image:
                linear-gradient(rgba(128,128,128,0.12) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(128,128,128,0.12) 1.5px, transparent 1.5px);
            background-size: 40px 40px;
        }

        body.darkTheme #grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,0.07) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255,255,255,0.07) 1.5px, transparent 1.5px);
        }

        #diagram-canvas {
            display: block;
            position: relative;
        }

        #zoom-controls {
            position: absolute;
            bottom: 14px;
            left: 14px;
            display: flex;
            align-items: center;
            gap: 0;
            background: var(--node-proxy-bg);
            border: 1px solid rgba(128,128,128,0.25);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
        }

        .zoom-btn {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            transition: background 0.15s;
            padding: 0;
            line-height: 1;
        }

        .zoom-btn:hover {
            background: rgba(128,128,128,0.12);
        }

        .zoom-btn:active {
            background: rgba(128,128,128,0.24);
        }

        #zoom-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 40px;
            text-align: center;
            pointer-events: none;
        }

        .zoom-divider {
            width: 1px;
            height: 18px;
            background: rgba(128,128,128,0.2);
        }

        /* SVG Node Styles */
        .internet-node rect {
            fill: var(--internet-fill);
            rx: 12;
        }

        .proxy-node rect {
            fill: var(--node-proxy-bg);
            stroke: var(--node-proxy-border);
            stroke-width: 1.5;
        }

        .proxy-node.stream rect {
            stroke-dasharray: 6 3;
        }

        .proxy-node.disabled rect {
            fill: var(--node-disabled-bg);
            stroke: var(--node-disabled-border);
            stroke-dasharray: 4 3;
        }

        .upstream-node rect {
            fill: var(--node-upstream-bg);
            stroke: var(--node-upstream-border);
            stroke-width: 1.5;
        }

        .upstream-node.inactive rect {
            fill: var(--node-disabled-bg);
            stroke: var(--node-disabled-border);
            stroke-dasharray: 4 3;
        }

        .node-title {
            font-size: 13px;
            font-weight: 600;
            fill: var(--text-primary);
        }

        .node-subtitle {
            font-size: 11px;
            fill: var(--text-secondary);
        }

        .node-count {
            font-size: 12px;
            font-weight: 700;
            fill: var(--text-count);
        }

        .internet-label {
            font-size: 12px;
            font-weight: 700;
            fill: var(--text-secondary);
            text-anchor: middle;
        }

        /* Animated flow edges */
        .flow-edge {
            fill: none;
            stroke-linecap: round;
            opacity: 0.75;
        }

        .flow-edge-internet {
            stroke: var(--edge-color);
        }

        .flow-edge-upstream {
            stroke: var(--edge-upstream-color);
        }

        .flow-edge-disabled {
            stroke: var(--node-disabled-border);
        }

        /* Live mode: an edge nothing flows through is grey and still */
        .flow-edge-idle {
            stroke: var(--node-disabled-border);
            opacity: 0.55;
        }

        .node-active {
            font-size: 11px;
            font-weight: 700;
            fill: var(--active-color);
        }

        /* The moving dashes are drawn on #flow-canvas (see drawFlow). A CSS stroke-dashoffset animation
           repaints the whole SVG on the main thread every frame: 73% of a core with a few dozen rules. */
        #flow-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            will-change: transform; /* own compositor layer: a new frame must not repaint the grid / controls */
        }

        #btn-anim.off i { opacity: 0.45; }

        .flow-dash-internet {
            stroke: #ffffff;
        }

        .flow-dash-upstream {
            stroke: #ffffff;
        }

        @keyframes flowDash {
            from { stroke-dashoffset: 40; }
            to   { stroke-dashoffset: 0; }
        }

        #loadingMsg {
            text-align: center;
            padding: 3em 0;
            color: var(--text-secondary);
        }

        #noDataMsg {
            display: none;
            text-align: center;
            padding: 3em 0;
            color: var(--text-secondary);
        }

        #legend-overlay {
            position: absolute;
            top: 48px;                 /* the top corner is empty; the bottom corner covered the upstream nodes */
            right: 10px;
            opacity: 0.92;
            display: flex;
            flex-direction: column;
            gap: 0.45em;
            background: var(--node-proxy-bg);
            border: 1px solid rgba(128,128,128,0.25);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 8px 12px;
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
            font-size: 0.78em;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5em;
            white-space: nowrap;
        }

        .legend-line {
            width: 24px;
            height: 4px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .legend-line-proxy { background: var(--edge-color); }
        .legend-line-upstream { background: var(--edge-upstream-color); }
        .legend-line-disabled { background: #bbb; }
        .legend-line-idle { background: var(--node-disabled-border); opacity: 0.7; }

        /* Header strip: live numbers on the left, Live / Today switch on the right */
        #live-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px 0 12px;
            background: var(--strip-bg);
            border-bottom: 1px solid rgba(128,128,128,0.25);
            z-index: 100;
            font-size: 13px;
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        #live-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #live-text b { font-weight: 700; }
        #live-text .live-extra { color: var(--text-secondary); }
        #live-dot {
            flex: none;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #9aa0a6;
        }
        #live-dot.fresh { background: var(--pulse-color); animation: livePulse 1.6s ease-out infinite; }
        #live-dot.error { background: #db2828; }
        @keyframes livePulse {
            0%   { box-shadow: 0 0 0 0 rgba(33,186,69,0.55); }
            70%  { box-shadow: 0 0 0 7px rgba(33,186,69,0); }
            100% { box-shadow: 0 0 0 0 rgba(33,186,69,0); }
        }
        #mode-switch { flex: none; display: inline-flex; border: 1px solid rgba(128,128,128,0.4); border-radius: 6px; overflow: hidden; }
        #mode-switch button {
            border: 0; margin: 0;
            padding: 3px 12px;
            font: inherit; font-size: 12px; font-weight: 600;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        #mode-switch button + button { border-left: 1px solid rgba(128,128,128,0.4); }
        #mode-switch button[aria-pressed="true"] { background: var(--edge-color); color: #fff; }
        #mode-switch button:focus-visible { outline: 2px solid var(--edge-color); outline-offset: -2px; }
        #fit-hint {
            position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - 24px);
            padding: 4px 12px; border-radius: 12px;
            background: rgba(30,30,40,0.82); color: #fff; font-size: 12px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            z-index: 100; pointer-events: none;
        }
        @media (max-width: 520px) {
            #live-text .live-extra { display: none; }
            #mode-switch button { padding: 3px 9px; }
        }
        @media (prefers-reduced-motion: reduce) {
            #live-dot.fresh { animation: none; }
        }
    </style>
</head>
<body class="darkTheme">
    <link rel="stylesheet" href="../darktheme.css">
    <script src="../script/darktheme.js"></script>
    <div id="loadingMsg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;"><i class="spinner loading icon"></i> Loading traffic data...</div>
    <div id="noDataMsg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;display:none;"><i class="info circle icon"></i> No proxy rules found.</div>
    <div id="diagram-wrapper">
        <div id="grid-bg"></div>
        <div id="live-strip">
            <span id="live-dot" aria-hidden="true"></span>
            <span id="live-text" role="status" aria-live="off">Live: measuring...</span>
            <span id="mode-switch" role="group" aria-label="Traffic map mode">
                <button type="button" id="mode-live" aria-pressed="true" title="Requests per second right now and requests being served">Live</button>
                <button type="button" id="mode-today" aria-pressed="false" title="Today's request totals">Today</button>
            </span>
        </div>
        <div id="fit-hint" style="display:none;">Drag to see the rest of the map</div>
        <div id="diagram-pan-container">
            <svg id="diagram-canvas"></svg>
        </div>
        <canvas id="flow-canvas"></canvas>
        <div id="zoom-controls">
            <button class="zoom-btn" id="btn-zoom-out" title="Zoom out">&#8722;</button>
            <div class="zoom-divider"></div>
            <span id="zoom-label">100%</span>
            <div class="zoom-divider"></div>
            <button class="zoom-btn" id="btn-zoom-in" title="Zoom in">&#43;</button>
            <div class="zoom-divider"></div>
            <button class="zoom-btn" id="btn-refresh" title="Refresh" onclick="loadDiagram(true)"><i class="refresh icon" style="color:#21ba45; font-size:13px;"></i></button>
            <div class="zoom-divider"></div>
            <button class="zoom-btn" id="btn-anim" title="Pause animation"><i class="pause icon" style="font-size:11px;"></i></button>
            <div class="zoom-divider"></div>
            <button class="zoom-btn" id="btn-rotate" title="Rotate layout"><i class="redo alternate icon" style="font-size:12px;"></i></button>
            <div class="zoom-divider"></div>
            <button class="zoom-btn" id="btn-fullscreen" title="Fullscreen"><i class="expand icon" style="font-size:11px;"></i></button>
        </div>
        <div id="legend-overlay">
            <div class="legend-item"><div class="legend-line legend-line-proxy"></div> Internet → Proxy Rule</div>
            <div class="legend-item"><div class="legend-line legend-line-upstream"></div> Proxy Rule → Upstream</div>
            <div class="legend-item" id="legend-idle"><div class="legend-line legend-line-idle"></div> No traffic now</div>
            <div class="legend-item"><div class="legend-line legend-line-disabled" style="border-top:2px dashed #bbb;height:0;width:24px;"></div> Disabled / Inactive</div>
        </div>
    </div>

    <script>
    /* Layout constants */
    const INTERNET_W = 80, INTERNET_H = 80;
    const PROXY_W = 176, PROXY_H = 54;
    const UPSTREAM_W = 172, UPSTREAM_H = 46;
    const COL_INTERNET_X = 40;
    const COL_PROXY_X = 200;
    const COL_UPSTREAM_X = 440;
    const ROW_GAP_PROXY = 16;
    const ROW_GAP_UPSTREAM = 10;
    const CANVAS_PADDING_Y = 24;
    const MIN_EDGE_W = 1.2;
    const MAX_EDGE_W = 10;
    const MAX_ANIMATED_EDGES = 40;
    let flowAnim = [];
    const ANIM_SPEEDS = [2.2, 1.8, 1.4, 1.1, 0.8]; // seconds, index by traffic tier

    /* Live / Today mode. Live (default) shows requests per second right now and the requests being
       served; Today shows the cumulative counters of the day. Remembered per browser. */
    let mode = "live";
    try { if (localStorage.getItem("zoraxy_trafficflow_mode") === "today") mode = "today"; } catch (e) {}
    const LIVE_POLL_MS = 2000;
    const LIVE_STALE_MS = 6000;
    const MIN_LABEL_ZOOM = 0.6; // fit never goes below this (about 5 px labels); a bigger map is shown at this zoom from its top-left corner and the rest is a drag away
    const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)");
    function isLive() { return mode === "live"; }
    /* effective flow of a node or edge in Live mode: a request in flight with no completed request yet still counts */
    function liveFlow(rps, inFlight) {
        rps = rps || 0;
        return rps > 0 ? rps : ((inFlight || 0) > 0 ? 0.3 : 0);
    }
    /* requests per second for humans: 0.4  3.2  47  1.2K */
    function fmtRate(r) {
        if (!(r > 0)) return "0";
        if (r < 0.1) return "<0.1";
        if (r < 10) return r.toFixed(1);
        if (r < 1000) return String(Math.round(r));
        return (r / 1000).toFixed(1) + "K";
    }
    /* dash period (seconds per cycle) from the live rate: slow trickle ~2.4 s, hundreds of req/s ~0.6 s */
    function livePeriod(rps) {
        return Math.max(0.5, 2.6 - 0.65 * Math.log10(1 + 10 * rps));
    }

    /* Zoom & Pan State */
    let panX = 20, panY = 20;
    let zoom = 1.0;
    const ZOOM_MIN = 0.25, ZOOM_MAX = 3.0, ZOOM_STEP = 0.15;
    let _firstLoad = true;

    /* Layout orientation: "horizontal" (Internet on the left) or
       "vertical" (Internet on top, upstreams at the bottom).
       Defaults to vertical to fit the status page's tall left column.
       Persisted in localStorage so the user's preference sticks. */
    let orientation = localStorage.getItem("zoraxy_trafficflow_orientation") || "vertical";
    let _lastData = null; // cache of the most recent API payload for re-render on rotate

    /* SVG namespace helper */
    function svgEl(tag, attrs) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
        return el;
    }

    /* Compute edge stroke width from traffic count */
    function edgeWidth(count, maxCount) {
        if (!maxCount || maxCount === 0) return MIN_EDGE_W;
        const ratio = Math.sqrt(count / maxCount); // sqrt for better visual scaling
        return MIN_EDGE_W + ratio * (MAX_EDGE_W - MIN_EDGE_W);
    }

    /* Animation speed from traffic tier */
    function animDuration(count, maxCount) {
        if (!maxCount || count === 0) return "2.8s";
        const ratio = count / maxCount;
        if (ratio > 0.8) return "0.7s";
        if (ratio > 0.6) return "1.0s";
        if (ratio > 0.4) return "1.4s";
        if (ratio > 0.2) return "1.8s";
        return "2.4s";
    }

    /* Width, colour class and dash period of an edge for a value (today: requests, live: flow) */
    function edgeStyle(value, maxValue, disabled, baseClass) {
        if (disabled) return { w: MIN_EDGE_W, cls: "flow-edge-disabled", count: 0, period: 0 };
        if (isLive()) {
            if (!(value > 0)) return { w: MIN_EDGE_W, cls: "flow-edge-idle", count: 0, period: 0 };
            const ref = Math.max(maxValue, 2); // a trickle must not look like a flood just because it is the busiest edge
            const ratio = Math.sqrt(Math.min(1, value / ref));
            return { w: MIN_EDGE_W + ratio * (MAX_EDGE_W - MIN_EDGE_W), cls: baseClass, count: value, period: livePeriod(value) };
        }
        return { w: edgeWidth(value, maxValue), cls: baseClass, count: value, period: parseFloat(animDuration(value, maxValue)) };
    }

    /* Truncate long domain/host names */
    function truncate(str, max) {
        return str.length > max ? str.slice(0, max - 1) + "…" : str;
    }

    /* Build a rounded-rect node group */
    function buildProxyNode(proxy, x, y) {
        const g = svgEl("g", { class: "proxy-node" + (proxy.disabled ? " disabled" : "") + (proxy.kind === "stream" ? " stream" : "") });

        const rx = 8;
        g.appendChild(svgEl("rect", {
            x, y, width: PROXY_W, height: PROXY_H,
            rx, ry: rx
        }));

        // Domain label
        const titleEl = svgEl("text", {
            x: x + 10, y: y + 19,
            class: "node-title"
        });
        titleEl.textContent = truncate(proxy.domain, 20);
        const tip = svgEl("title"); tip.textContent = proxy.domain; g.appendChild(tip);
        g.appendChild(titleEl);

        // Status / disabled badge
        if (proxy.disabled) {
            const badge = svgEl("text", { x: x + PROXY_W - 10, y: y + 19, class: "node-subtitle", "text-anchor": "end" });
            badge.textContent = proxy.kind === "stream" ? "stopped" : "disabled";
            g.appendChild(badge);
        }

        // Request count (Live: requests per second right now)
        const countEl = svgEl("text", { x: x + 10, y: y + 36, class: "node-count" });
        const live = isLive() && proxy.kind !== "stream";
        countEl.textContent = proxy.kind === "stream" ? (proxy.detail || "stream")
            : live ? fmtRate(proxy.rps) + " req/s" : fmtCount(proxy.requestCount) + " req";
        g.appendChild(countEl);

        // Upstream count hint (Live: requests being served right now)
        if (live && !proxy.disabled) {
            const act = svgEl("text", { x: x + PROXY_W - 10, y: y + 36, class: proxy.inFlight > 0 ? "node-active" : "node-subtitle", "text-anchor": "end" });
            act.textContent = proxy.inFlight > 0 ? proxy.inFlight + " active" : "idle";
            g.appendChild(act);
        } else {
            const uHint = svgEl("text", { x: x + PROXY_W - 10, y: y + 36, class: "node-subtitle", "text-anchor": "end" });
            uHint.textContent = proxy.kind === "stream" ? "" : proxy.upstreams.length + " upstream" + (proxy.upstreams.length !== 1 ? "s" : "");
            g.appendChild(uHint);
        }

        return g;
    }

    function buildUpstreamNode(upstream, x, y) {
        const g = svgEl("g", { class: "upstream-node" + (upstream.inactive ? " inactive" : "") });
        const rx = 8;
        g.appendChild(svgEl("rect", {
            x, y, width: UPSTREAM_W, height: UPSTREAM_H,
            rx, ry: rx
        }));

        // TLS badge
        const tlsBadge = upstream.requireTLS ? "🔒 " : "";

        const titleEl = svgEl("text", { x: x + 10, y: y + 17, class: "node-title" });
        titleEl.textContent = truncate(upstream.origin, upstream.inactive || upstream.requireTLS ? 16 : 20);
        const tip = svgEl("title"); tip.textContent = upstream.origin; g.appendChild(tip);
        g.appendChild(titleEl);

        if (upstream.inactive) {
            const badge = svgEl("text", { x: x + UPSTREAM_W - 10, y: y + 17, class: "node-subtitle", "text-anchor": "end" });
            badge.textContent = "inactive";
            g.appendChild(badge);
        } else if (upstream.requireTLS) {
            const badge = svgEl("text", { x: x + UPSTREAM_W - 10, y: y + 17, class: "node-subtitle", "text-anchor": "end" });
            badge.textContent = "TLS";
            g.appendChild(badge);
        }

        const live = isLive() && !upstream.inactive;
        const countEl = svgEl("text", { x: x + 10, y: y + 34, class: "node-count" });
        countEl.textContent = live ? fmtRate(upstream.rps) + " req/s" : fmtCount(upstream.requestCount) + " req";
        g.appendChild(countEl);
        if (live) {
            const act = svgEl("text", { x: x + UPSTREAM_W - 10, y: y + 34, class: upstream.inFlight > 0 ? "node-active" : "node-subtitle", "text-anchor": "end" });
            act.textContent = upstream.inFlight > 0 ? upstream.inFlight + " active" : "idle";
            g.appendChild(act);
        }

        return g;
    }

    /* Build the Internet node (globe icon with circle background) */
    function buildInternetNode(x, y, h) {
        const g = svgEl("g", { class: "internet-node" });
        const cy = y + h / 2;
        const cx = x + INTERNET_W / 2;
        const r = 32;

        // Circle background
        const circle = svgEl("circle", {
            cx, cy, r,
            fill: "var(--internet-fill)"
        });
        g.appendChild(circle);

        // Globe icon — simple SVG globe lines
        const globeG = svgEl("g", { stroke: "rgba(255,255,255,0.55)", "stroke-width": "1.5", fill: "none" });
        globeG.appendChild(svgEl("circle", { cx, cy, r: r - 1, stroke: "rgba(255,255,255,0.3)" }));
        // Latitude lines
        for (const dy of [-14, 0, 14]) {
            const halfW = Math.sqrt(Math.max(0, r * r - dy * dy)) * 0.95;
            globeG.appendChild(svgEl("path", {
                d: `M ${cx - halfW} ${cy + dy} Q ${cx} ${cy + dy - 5} ${cx + halfW} ${cy + dy}`
            }));
        }
        // Vertical meridian
        globeG.appendChild(svgEl("ellipse", { cx, cy, rx: 14, ry: r - 1 }));
        g.appendChild(globeG);

        // Label — placed below the circle in horizontal mode, above it in
        // vertical mode so it does not sit on top of the downward flow edges.
        const labelY = (orientation === "vertical") ? (cy - r - 8) : (cy + r + 14);
        const label = svgEl("text", {
            x: cx, y: labelY,
            class: "internet-label",
            "font-size": "11",
            "text-anchor": "middle"
        });
        label.textContent = "Internet";
        g.appendChild(label);

        return g;
    }

    /* Draw an animated cubic Bezier flow edge between two points */
    function buildFlowEdge(x1, y1, x2, y2, strokeW, colorClass, count, period, edgeIndex) {
        const g = svgEl("g", {});

        // S-curve oriented along the flow axis: horizontal mode bends left↔right,
        // vertical mode bends top↔bottom.
        let d;
        if (orientation === "vertical") {
            const my = (y1 + y2) / 2;
            d = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
        } else {
            const mx = (x1 + x2) / 2;
            d = `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`;
        }

        // Background solid path
        const base = svgEl("path", {
            d,
            class: "flow-edge " + colorClass,
            "stroke-width": strokeW
        });
        g.appendChild(base);

        // Moving dashes: drawn on the canvas overlay, only for the busiest edges
        if (count > 0 && edgeIndex < MAX_ANIMATED_EDGES) {
            flowAnim.push({
                path: new Path2D(d),
                // control points bound the curve: used to skip edges that are scrolled out of view
                x0: Math.min(x1, x2), x1: Math.max(x1, x2), y0: Math.min(y1, y2), y1: Math.max(y1, y2),
                width: Math.max(strokeW * 0.55, 1.2),
                period: period,
                phase: (edgeIndex * 0.17) % 1.4
            });
        }

        return g;
    }

    /* Main render function: build and populate the SVG diagram from API data */
    function renderDiagram(data) {
        const svg = document.getElementById("diagram-canvas");
        svg.innerHTML = "";
        flowAnim = [];

        const proxies = data.proxies || [];

        if (proxies.length === 0) {
            document.getElementById("noDataMsg").style.display = "block";
            svg.style.display = "none";
            return;
        }
        document.getElementById("noDataMsg").style.display = "none";
        svg.style.display = "block";

        const vertical = orientation === "vertical";

        // Map a (primary, cross) layout coordinate to screen (x, y).
        //   primary = flow axis (Internet → Proxy → Upstream)
        //   cross   = stacking axis (rows of proxies / upstreams)
        // In vertical mode the two axes are swapped so the flow runs top→bottom.
        function toXY(primary, cross) {
            return vertical ? { x: cross, y: primary } : { x: primary, y: cross };
        }

        // Node boxes are always drawn the same size (so text stays horizontal and
        // readable), but which box dimension lies along the flow vs. the stacking
        // axis swaps with orientation.
        const proxyPrimaryExtent    = vertical ? PROXY_H    : PROXY_W;
        const proxyCrossExtent      = vertical ? PROXY_W    : PROXY_H;
        const upstreamPrimaryExtent = vertical ? UPSTREAM_H : UPSTREAM_W;
        const upstreamCrossExtent   = vertical ? UPSTREAM_W : UPSTREAM_H;
        const internetCrossExtent   = INTERNET_W; // square node — same either way

        // Build SVG defs: drop-shadow filter
        const defs = svgEl("defs");


        svg.appendChild(defs);

        // The busiest metric of a rule: today's requests, or the live flow
        const live = isLive();
        const pm = p => live ? liveFlow(p.rps, p.inFlight) : p.requestCount;
        const um = u => live ? liveFlow(u.rps, u.inFlight) : u.requestCount;

        // Sort proxies by traffic, highest first
        proxies.sort((a, b) => pm(b) - pm(a));

        // Compute max traffic count for edge width scaling
        const maxProxyCount = Math.max(...proxies.map(pm), live ? 0 : 1);

        // Build deduplicated upstream map
        // Key: origin string → { origin, requireTLS, inactive, requestCount, rowIndex }
        // Traffic counts are summed across all proxy rules that share the same upstream.
        // A shared upstream is considered active if at least one proxy treats it as active.
        const upstreamMap = new Map();
        for (const proxy of proxies) {
            for (const us of proxy.upstreams) {
                if (upstreamMap.has(us.origin)) {
                    const existing = upstreamMap.get(us.origin);
                    // upstream.requestCount is a global stat (not per-proxy), so take the max, not the sum
                    existing.requestCount = Math.max(existing.requestCount, us.requestCount);
                    existing.rps = Math.max(existing.rps, us.rps || 0);
                    existing.inFlight += us.inFlight || 0;
                    if (!us.inactive) existing.inactive = false;
                } else {
                    upstreamMap.set(us.origin, {
                        origin:       us.origin,
                        requireTLS:   us.requireTLS,
                        inactive:     us.inactive,
                        requestCount: us.requestCount,
                        rps:          us.rps || 0,
                        inFlight:     us.inFlight || 0,
                        rowIndex:     -1, // assigned below
                    });
                }
            }
        }

        // Assign row indices to unique upstreams
        let nextRow = 0;
        for (const u of upstreamMap.values()) {
            u.rowIndex = nextRow++;
        }

        // Proxies with no upstreams each get their own placeholder row at the end
        const noUpstreamProxyRows = new Map(); // proxy domain → rowIndex
        for (const proxy of proxies) {
            if (proxy.upstreams.length === 0) {
                noUpstreamProxyRows.set(proxy.domain, nextRow++);
            }
        }

        const totalUpstreamRows = nextRow;
        const maxUpstreamCount  = Math.max(...Array.from(upstreamMap.values()).map(um), live ? 0 : 1);

        // Column sizes along the cross (stacking) axis
        const upstreamColumnCross = totalUpstreamRows * (upstreamCrossExtent + ROW_GAP_UPSTREAM) - ROW_GAP_UPSTREAM;
        const proxyColumnCross    = proxies.length * (proxyCrossExtent + ROW_GAP_PROXY) - ROW_GAP_PROXY;
        const crossSize = Math.max(upstreamColumnCross, proxyColumnCross, internetCrossExtent + 40) + CANVAS_PADDING_Y * 2;

        // Cross-axis start (centres each column within the canvas)
        const proxyCrossStart    = CANVAS_PADDING_Y + Math.max(0, (crossSize - CANVAS_PADDING_Y * 2 - proxyColumnCross) / 2);
        const upstreamCrossStart = CANVAS_PADDING_Y + Math.max(0, (crossSize - CANVAS_PADDING_Y * 2 - upstreamColumnCross) / 2);
        const internetCrossCenter = crossSize / 2;

        // Primary axis is fixed by the column positions; swap into width/height
        const primarySize = COL_UPSTREAM_X + upstreamPrimaryExtent + 40;
        const canvasWidth  = vertical ? crossSize   : primarySize;
        const canvasHeight = vertical ? primarySize : crossSize;
        svg.setAttribute("width", canvasWidth);
        svg.setAttribute("height", canvasHeight);
        svg.setAttribute("viewBox", `0 0 ${canvasWidth} ${canvasHeight}`);

        // Layer groups: edges are rendered below nodes
        const edgeGroup = svgEl("g", { id: "edges" });
        const nodeGroup = svgEl("g", { id: "nodes" });
        svg.appendChild(edgeGroup);
        svg.appendChild(nodeGroup);

        // Place Internet node at the start of the primary axis, centred on cross axis
        const internetPrimaryCenter = COL_INTERNET_X + INTERNET_W / 2;
        const internetTL = toXY(COL_INTERNET_X, internetCrossCenter - internetCrossExtent / 2);
        nodeGroup.appendChild(buildInternetNode(internetTL.x, internetTL.y, INTERNET_H));

        // Internet exit connection point (far primary edge of the circle, cross centre)
        const internetExit = toXY(internetPrimaryCenter + 32, internetCrossCenter);

        let edgeIndex = 0;

        for (let pi = 0; pi < proxies.length; pi++) {
            const proxy = proxies[pi];
            const proxyCrossCenter = proxyCrossStart + pi * (proxyCrossExtent + ROW_GAP_PROXY) + proxyCrossExtent / 2;

            // Proxy node top-left and connection points
            const proxyTL    = toXY(COL_PROXY_X, proxyCrossCenter - proxyCrossExtent / 2);
            const proxyEntry = toXY(COL_PROXY_X, proxyCrossCenter);                       // near primary edge
            const proxyExit  = toXY(COL_PROXY_X + proxyPrimaryExtent, proxyCrossCenter);  // far primary edge

            // Draw edge from Internet node to proxy node
            const st1 = edgeStyle(pm(proxy), maxProxyCount, false, "flow-edge-internet");
            if (proxy.disabled) { st1.w = MIN_EDGE_W; st1.count = 0; st1.period = 0; if (live) st1.cls = "flow-edge-idle"; }
            edgeGroup.appendChild(buildFlowEdge(
                internetExit.x, internetExit.y,
                proxyEntry.x, proxyEntry.y,
                st1.w, st1.cls, st1.count, st1.period, edgeIndex++
            ));

            // Proxy node
            nodeGroup.appendChild(buildProxyNode(proxy, proxyTL.x, proxyTL.y));

            // Draw edges from proxy to each deduplicated upstream
            if (proxy.upstreams.length > 0) {
                for (const upstream of proxy.upstreams) {
                    const dedupedUs = upstreamMap.get(upstream.origin);
                    const upstreamCrossCenter = upstreamCrossStart + dedupedUs.rowIndex * (upstreamCrossExtent + ROW_GAP_UPSTREAM) + upstreamCrossExtent / 2;
                    const upstreamEntry = toXY(COL_UPSTREAM_X, upstreamCrossCenter);

                    const linkDisabled = upstream.inactive || proxy.disabled;
                    const st2 = edgeStyle(Math.min(pm(proxy), um(upstream)), maxUpstreamCount, linkDisabled, "flow-edge-upstream");
                    edgeGroup.appendChild(buildFlowEdge(
                        proxyExit.x, proxyExit.y,
                        upstreamEntry.x, upstreamEntry.y,
                        st2.w, st2.cls, st2.count, st2.period, edgeIndex++
                    ));
                }
            } else {
                // No upstreams — draw edge to this proxy's placeholder row
                const phRow = noUpstreamProxyRows.get(proxy.domain);
                const upstreamCrossCenter = upstreamCrossStart + phRow * (upstreamCrossExtent + ROW_GAP_UPSTREAM) + upstreamCrossExtent / 2;
                const upstreamEntry = toXY(COL_UPSTREAM_X, upstreamCrossCenter);
                edgeGroup.appendChild(buildFlowEdge(
                    proxyExit.x, proxyExit.y,
                    upstreamEntry.x, upstreamEntry.y,
                    MIN_EDGE_W, live ? "flow-edge-idle" : "flow-edge-upstream", 0, 0, edgeIndex++
                ));
                const phTL = toXY(COL_UPSTREAM_X, upstreamCrossCenter - upstreamCrossExtent / 2);
                const ph = svgEl("g", { class: "upstream-node inactive" });
                ph.appendChild(svgEl("rect", {
                    x: phTL.x, y: phTL.y,
                    width: UPSTREAM_W, height: UPSTREAM_H, rx: 8, ry: 8
                }));
                const phText = svgEl("text", { x: phTL.x + 10, y: phTL.y + 27, class: "node-subtitle" });
                phText.textContent = "No upstreams configured";
                ph.appendChild(phText);
                nodeGroup.appendChild(ph);
            }
        }

        // Render each unique upstream node exactly once
        for (const dedupedUs of upstreamMap.values()) {
            const upstreamCrossCenter = upstreamCrossStart + dedupedUs.rowIndex * (upstreamCrossExtent + ROW_GAP_UPSTREAM) + upstreamCrossExtent / 2;
            const usTL = toXY(COL_UPSTREAM_X, upstreamCrossCenter - upstreamCrossExtent / 2);
            nodeGroup.appendChild(buildUpstreamNode(dedupedUs, usTL.x, usTL.y));
        }
    }

    /* Fetch traffic map from API and trigger diagram render.
       _lastData = structure + today's counters (/api/stats/trafficmap, every 30 s),
       _live     = requests per second and in-flight counts (/api/stats/livemap, every 2 s in Live mode). */
    let _lastJSON = "";
    let _onScreen = true;
    let _live = null;          // last good answer of /api/stats/livemap
    let _liveAt = 0;           // when it arrived (performance.now())
    let _liveState = "wait";   // wait | ok | error | paused
    let _liveTimer = null, _liveBusy = false;

    /* the data the diagram draws: the structure with the live numbers merged in (rates rounded so a quiet map is not rebuilt every poll) */
    function viewData() {
        if (!_lastData) return null;
        if (!isLive()) return _lastData;
        const byDomain = new Map();
        if (_live && _live.proxies) for (const p of _live.proxies) byDomain.set(p.domain, p);
        const r1 = v => Math.round((v || 0) * 10) / 10;
        const out = { proxies: [], totalRequests: _lastData.totalRequests, live: true };
        for (const p of _lastData.proxies || []) {
            const lp = byDomain.get(p.domain);
            const q = Object.assign({}, p, { rps: lp ? r1(lp.rps) : 0, inFlight: lp ? lp.inFlight : 0 });
            const ups = new Map();
            if (lp) for (const u of lp.upstreams || []) ups.set(u.origin, u);
            q.upstreams = (p.upstreams || []).map(u => {
                const lu = ups.get(u.origin);
                return Object.assign({}, u, { rps: lu ? r1(lu.rps) : 0, inFlight: lu ? lu.inFlight : 0 });
            });
            out.proxies.push(q);
        }
        return out;
    }

    function drawView(forceFit) {
        const view = viewData();
        if (!view) return;
        const sig = mode + JSON.stringify(view);
        if (sig === _lastJSON && !forceFit) {
            document.getElementById("diagram-canvas").style.display = "block";
            return;
        }
        _lastJSON = sig;
        renderDiagram(view);
        requestFlowDraw();
        if (_firstLoad || forceFit) {
            _firstLoad = false;
            recenterDiagram();
        }
    }

    function loadDiagram(manual) {
        if (_firstLoad || manual === true) {
            document.getElementById("loadingMsg").style.display = "block";
            document.getElementById("diagram-canvas").style.display = "none";
            document.getElementById("noDataMsg").style.display = "none";
        }

        $.get("/api/stats/trafficmap", function(data) {
            document.getElementById("loadingMsg").style.display = "none";
            _lastData = data;
            drawView(false);
            if (isLive() && manual === true) liveTick();
        }).fail(function() {
            document.getElementById("loadingMsg").innerHTML =
                '<i class="exclamation triangle icon"></i> Failed to load traffic data.';
        });
    }

    /* ---- Live polling: only while the map is on screen, the tab is active and the animation is not paused ---- */
    function livePolling() { return isLive() && _onScreen && !document.hidden && _animOn; }

    function liveTick() {
        if (_liveBusy || !livePolling()) return;
        _liveBusy = true;
        $.ajax({ url: "/api/stats/livemap", dataType: "json", timeout: 4000, cache: false }).done(function(d) {
            _liveBusy = false;
            if (!d || !Array.isArray(d.proxies)) { _liveState = "error"; updateStrip(); return; }
            _live = d; _liveAt = performance.now(); _liveState = "ok";
            updateStrip();
            if (_lastData) drawView(false);
        }).fail(function() {
            _liveBusy = false;
            _liveState = "error";
            updateStrip();
        });
    }

    function syncLivePolling() {
        if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
        if (livePolling()) {
            if (_liveState === "paused") _liveState = "wait";
            liveTick();
            _liveTimer = setInterval(function () { updateStrip(); liveTick(); }, LIVE_POLL_MS);
        } else if (isLive()) {
            _liveState = "paused";
        }
        updateStrip();
    }

    /* header strip: "Live: X req/s, Y active" with a pulse dot that stops when the data is stale */
    function updateStrip() {
        const dot = document.getElementById("live-dot"), txt = document.getElementById("live-text");
        if (!isLive()) {
            dot.className = "";
            const n = _lastData ? _lastData.totalRequests || 0 : 0;
            txt.innerHTML = "";
            txt.appendChild(document.createTextNode("Today: "));
            const b = document.createElement("b"); b.textContent = fmtCount(n); txt.appendChild(b);
            txt.appendChild(document.createTextNode(" requests"));
            txt.removeAttribute("title");
            return;
        }
        const stale = _liveState === "ok" && performance.now() - _liveAt > LIVE_STALE_MS;
        if (_liveState === "error" || stale) {
            dot.className = "error";
            txt.textContent = "Live data unavailable";
            txt.title = "The server did not answer the last live update";
        } else if (_liveState === "paused") {
            dot.className = "";
            txt.textContent = "Live paused";
            txt.title = "Updates are stopped while the animation is paused or the tab is not active";
        } else if (_liveState === "ok" && _live) {
            dot.className = _live.warmup ? "" : "fresh";
            txt.innerHTML = "";
            if (_live.warmup) {
                txt.textContent = "Live: measuring...";
            } else {
                txt.appendChild(document.createTextNode("Live: "));
                const b = document.createElement("b"); b.textContent = fmtRate(_live.totalRps) + " req/s"; txt.appendChild(b);
                txt.appendChild(document.createTextNode(", "));
                const c = document.createElement("b"); c.textContent = (_live.totalInFlight || 0) + " active"; txt.appendChild(c);
                const extra = [];
                if (_live.errorsPerSec >= 0.05) extra.push(fmtRate(_live.errorsPerSec) + " errors/s");
                if (_live.blockedPerSec >= 0.05) extra.push(fmtRate(_live.blockedPerSec) + " blocked/s");
                if (extra.length) {
                    const e = document.createElement("span"); e.className = "live-extra"; e.textContent = " · " + extra.join(" · ");
                    txt.appendChild(e);
                }
            }
            txt.title = "Averaged over the last " + Math.round(_live.windowSeconds || 10) + " seconds. Active = requests being served right now.";
        } else {
            dot.className = "";
            txt.textContent = "Live: measuring...";
        }
    }

    function setMode(m) {
        if (m === mode) return;
        mode = m;
        try { localStorage.setItem("zoraxy_trafficflow_mode", mode); } catch (e) {}
        syncModeUI();
        _lastJSON = "";
        syncLivePolling();
        drawView(false);
    }

    function syncModeUI() {
        document.getElementById("mode-live").setAttribute("aria-pressed", isLive() ? "true" : "false");
        document.getElementById("mode-today").setAttribute("aria-pressed", isLive() ? "false" : "true");
        document.getElementById("legend-idle").style.display = isLive() ? "" : "none";
        updateStrip();
    }
    document.getElementById("mode-live").addEventListener("click", e => { e.stopPropagation(); setMode("live"); });
    document.getElementById("mode-today").addEventListener("click", e => { e.stopPropagation(); setMode("today"); });
    document.getElementById("live-strip").addEventListener("mousedown", e => e.stopPropagation());
    document.getElementById("live-strip").addEventListener("touchstart", e => e.stopPropagation(), { passive: true });

    /* Centre the diagram canvas within the viewport at the current zoom */
    function recenterDiagram() {
        const wEl = document.getElementById("diagram-wrapper");
        const c = document.getElementById("diagram-canvas");
        const svgW = parseFloat(c.getAttribute("width") || 0);
        const svgH = parseFloat(c.getAttribute("height") || 0);
        // Fit: a big map is scaled down (never up) so no node is cut off at the edges, and the
        // bottom strip with the zoom bar and the legend is kept free of nodes.
        const vw = wEl.clientWidth, vh = wEl.clientHeight;
        // The header strip (36 px) sits on top of the map. Labels must stay readable: when the whole map would need
        // a zoom below MIN_LABEL_ZOOM, it is shown at that zoom from its top-left corner (busiest rules first) and
        // the rest is a drag away, instead of 5 px text.
        const padX = 16, padTop = 16 + 36, padBottom = 64;
        let overflow = false;
        if (svgW > 0 && svgH > 0 && vw > 0 && vh > 0) {
            const fit = Math.min(1, (vw - 2 * padX) / svgW, (vh - padTop - padBottom) / svgH);
            if (isFinite(fit) && fit > 0) {
                zoom = Math.max(ZOOM_MIN, fit);
                if (fit < MIN_LABEL_ZOOM) { zoom = MIN_LABEL_ZOOM; overflow = true; }
            }
        }
        panX = (vw - svgW * zoom) / 2; // also when it overflows: the Internet node is in the middle of the map, the outer rules are a drag away
        panY = padTop + (overflow ? 0 : Math.max(0, (vh - padTop - padBottom - svgH * zoom) / 2));
        applyTransform();
        if (overflow) showFitHint();
    }

    let _hintTimer = null;
    function showFitHint() {
        const h = document.getElementById("fit-hint");
        h.style.display = "block";
        clearTimeout(_hintTimer);
        _hintTimer = setTimeout(() => { h.style.display = "none"; }, 6000);
    }

    /* Toggle between horizontal and vertical flow layouts */
    function toggleOrientation() {
        orientation = (orientation === "vertical") ? "horizontal" : "vertical";
        localStorage.setItem("zoraxy_trafficflow_orientation", orientation);
        updateRotateButton();
        if (_lastData) {
            renderDiagram(viewData());
            recenterDiagram();
            requestFlowDraw();
        } else {
            loadDiagram();
        }
    }

    /* Keep the rotate button tooltip in sync with the current orientation */
    function updateRotateButton() {
        const btn = document.getElementById("btn-rotate");
        if (!btn) return;
        btn.title = (orientation === "vertical")
            ? "Switch to horizontal layout"
            : "Switch to vertical layout";
    }

    /* Compact number formatter (referenced before renderDiagram definition) */
    function fmtCount(n) {
        n = parseInt(n) || 0;
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000)    return (n / 1000).toFixed(1) + "K";
        return String(n);
    }

    /* Apply current pan/zoom transform to the pan container */
    function applyTransform() {
        const container = document.getElementById("diagram-pan-container");
        container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
        const grid = document.getElementById("grid-bg");
        const gs = 40 * zoom;
        grid.style.backgroundSize = gs + "px " + gs + "px";
        grid.style.backgroundPosition = (panX % gs) + "px " + (panY % gs) + "px";
        requestFlowDraw();
        document.getElementById("zoom-label").textContent = Math.round(zoom * 100) + "%";
    }

    /* Zoom to a new level, centered on viewport point (ox, oy) */
    function zoomTo(newZoom, ox, oy) {
        const wrapper = document.getElementById("diagram-wrapper");
        if (ox === undefined) ox = wrapper.clientWidth / 2;
        if (oy === undefined) oy = wrapper.clientHeight / 2;
        const clamped = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, newZoom));
        panX = ox - (ox - panX) * (clamped / zoom);
        panY = oy - (oy - panY) * (clamped / zoom);
        zoom = clamped;
        applyTransform();
    }

    function zoomIn()  { zoomTo(zoom + ZOOM_STEP); }
    function zoomOut() { zoomTo(zoom - ZOOM_STEP); }

    document.getElementById("btn-zoom-in").addEventListener("click",  e => { e.stopPropagation(); zoomIn(); });
    document.getElementById("btn-zoom-out").addEventListener("click", e => { e.stopPropagation(); zoomOut(); });

    /* Mouse drag pan handler */
    const _wrapper = document.getElementById("diagram-wrapper");
    let _dragging = false, _dragSX = 0, _dragSY = 0, _panSX = 0, _panSY = 0;

    _wrapper.addEventListener("mousedown", e => {
        if (e.target.closest("#zoom-controls")) return;
        _dragging = true;
        _dragSX = e.clientX; _dragSY = e.clientY;
        _panSX = panX;       _panSY = panY;
        _wrapper.classList.add("dragging");
        e.preventDefault();
    });

    window.addEventListener("mousemove", e => {
        if (!_dragging) return;
        panX = _panSX + (e.clientX - _dragSX);
        panY = _panSY + (e.clientY - _dragSY);
        applyTransform();
    });

    window.addEventListener("mouseup", () => {
        _dragging = false;
        _wrapper.classList.remove("dragging");
    });

    /* Scroll-wheel zoom toward cursor position */
    _wrapper.addEventListener("wheel", e => {
        e.preventDefault();
        const rect = _wrapper.getBoundingClientRect();
        const ox = e.clientX - rect.left;
        const oy = e.clientY - rect.top;
        zoomTo(zoom + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP), ox, oy);
    }, { passive: false });

    /* Touch pan and pinch-zoom handler */
    let _tSX = 0, _tSY = 0, _pinchDist = 0, _pinchZoom = 1, _pinchMX = 0, _pinchMY = 0;

    _wrapper.addEventListener("touchstart", e => {
        if (e.target.closest("#zoom-controls")) return;
        if (e.touches.length === 1) {
            _tSX = e.touches[0].clientX; _tSY = e.touches[0].clientY;
            _panSX = panX; _panSY = panY;
        } else if (e.touches.length === 2) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            _pinchDist  = Math.hypot(dx, dy);
            _pinchZoom  = zoom;
            const rect  = _wrapper.getBoundingClientRect();
            _pinchMX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
            _pinchMY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        }
        e.preventDefault();
    }, { passive: false });

    _wrapper.addEventListener("touchmove", e => {
        if (e.touches.length === 1) {
            panX = _panSX + (e.touches[0].clientX - _tSX);
            panY = _panSY + (e.touches[0].clientY - _tSY);
            applyTransform();
        } else if (e.touches.length === 2) {
            const dx   = e.touches[1].clientX - e.touches[0].clientX;
            const dy   = e.touches[1].clientY - e.touches[0].clientY;
            const dist = Math.hypot(dx, dy);
            zoomTo(_pinchZoom * (dist / _pinchDist), _pinchMX, _pinchMY);
        }
        e.preventDefault();
    }, { passive: false });

    _wrapper.addEventListener("touchend", e => {
        if (e.touches.length === 1) {
            _tSX = e.touches[0].clientX; _tSY = e.touches[0].clientY;
            _panSX = panX; _panSY = panY;
        }
    });

    /* Fullscreen toggle */
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    }

    document.getElementById("btn-fullscreen").addEventListener("click", e => {
        e.stopPropagation();
        toggleFullscreen();
    });

    document.getElementById("btn-rotate").addEventListener("click", e => {
        e.stopPropagation();
        toggleOrientation();
    });

    document.addEventListener("fullscreenchange", () => {
        const btn = document.getElementById("btn-fullscreen");
        if (document.fullscreenElement) {
            btn.innerHTML = '<i class="compress icon" style="font-size:11px;"></i>';
            btn.title = "Exit fullscreen";
        } else {
            btn.innerHTML = '<i class="expand icon" style="font-size:11px;"></i>';
            btn.title = "Fullscreen";
        }
    });

    /* Initialize: apply transform, load data, start 30-second auto-refresh */
    /* Animation control: user toggle (persisted), parent page message, off-screen and hidden tab */
    var _animOn = true; // var: livePolling() reads it from the first loadDiagram() below
    try { _animOn = localStorage.getItem("zoraxy_trafficflow_anim") !== "off"; } catch (e) {}
    updateRotateButton();
    applyTransform();
    syncModeUI();
    loadDiagram();
    setInterval(function () {
        // no network and no re-render while the diagram is not on screen (other tab, hidden iframe);
        // in Live mode the pause button stops this too (Today keeps its old behaviour)
        if (document.hidden || !_onScreen || (isLive() && !_animOn)) return;
        loadDiagram();
    }, 30000);
    const _flowCanvas = document.getElementById("flow-canvas");
    const _flowCtx = _flowCanvas.getContext("2d");
    var _flowPending = false, _flowTimer = null, _flowW = 0, _flowH = 0; // var: applyTransform() calls requestFlowDraw() before this line runs
    const FLOW_FPS = 8; // stop-motion style flow; every extra frame costs a full repaint of the iframe

    // The canvas size is only re-read when the wrapper was resized (reading clientWidth on every
    // frame forces a synchronous layout).
    var _flowDirtySize = true;
    function sizeFlowCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        if (_flowDirtySize) {
            _flowDirtySize = false;
            const w = _wrapper.clientWidth, h = _wrapper.clientHeight;
            if (w !== _flowW || h !== _flowH) {
                _flowW = w; _flowH = h;
                _flowCanvas.width = Math.max(1, Math.round(w * dpr));
                _flowCanvas.height = Math.max(1, Math.round(h * dpr));
            }
        }
        return dpr;
    }

    /* Draw the dashes at animation time t (seconds) in the current pan / zoom */
    function drawFlow(t) {
        const dpr = sizeFlowCanvas();
        const ctx = _flowCtx;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, _flowCanvas.width, _flowCanvas.height);
        if (flowAnim.length === 0) return;
        ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * panX, dpr * panY);
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineCap = "round";
        ctx.setLineDash([1, 20]);
        // visible region in diagram coordinates
        const vx0 = -panX / zoom - 4, vy0 = -panY / zoom - 4;
        const vx1 = vx0 + _flowW / zoom + 8, vy1 = vy0 + _flowH / zoom + 8;
        for (const a of flowAnim) {
            if (a.x1 < vx0 || a.x0 > vx1 || a.y1 < vy0 || a.y0 > vy1) continue;
            ctx.lineWidth = a.width;
            // same motion as the old keyframes: dash offset 40 -> 0 over one period
            ctx.lineDashOffset = 40 * (1 - ((t + a.phase) / a.period) % 1);
            ctx.stroke(a.path);
        }
    }

    var _idle = false; // set by the Status page after a while without user activity
    function flowRunning() { return _animOn && _onScreen && !document.hidden && !_idle && !(REDUCED_MOTION && REDUCED_MOTION.matches); }

    function requestFlowDraw() {
        // pan / zoom: redraw once per frame; the animation timer keeps its own cadence
        if (_flowPending) return;
        _flowPending = true;
        requestAnimationFrame(() => { _flowPending = false; drawFlow(flowRunning() ? performance.now() / 1000 : 0); });
    }

    function startFlowLoop() {
        if (_flowTimer) { clearInterval(_flowTimer); _flowTimer = null; }
        if (flowRunning()) {
            _flowTimer = setInterval(() => { if (flowAnim.length) drawFlow(performance.now() / 1000); }, 1000 / FLOW_FPS); // nothing flows: nothing is redrawn
        } else {
            requestFlowDraw();
        }
    }
    new ResizeObserver(() => { _flowDirtySize = true; requestFlowDraw(); }).observe(_wrapper);

    if (REDUCED_MOTION && REDUCED_MOTION.addEventListener) REDUCED_MOTION.addEventListener("change", () => applyAnim());

    function applyAnim() {
        document.body.classList.toggle("anim-paused", !flowRunning());
        startFlowLoop();
        syncLivePolling();
        const b = document.getElementById("btn-anim");
        b.classList.toggle("off", !_animOn);
        b.title = _animOn ? "Pause animation" : "Resume animation";
        b.querySelector("i").className = (_animOn ? "pause" : "play") + " icon";
    }
    document.getElementById("btn-anim").addEventListener("click", e => {
        e.stopPropagation();
        _animOn = !_animOn;
        try { localStorage.setItem("zoraxy_trafficflow_anim", _animOn ? "on" : "off"); } catch (err) {}
        applyAnim();
    });
    window.addEventListener("message", e => {
        if (e.origin !== window.location.origin || !e.data || e.data.type !== "zoraxy-diagram") return;
        if (typeof e.data.anim === "boolean") { _animOn = e.data.anim; applyAnim(); }
        if (typeof e.data.idle === "boolean") { _idle = e.data.idle; applyAnim(); }
    });
    document.addEventListener("visibilitychange", applyAnim);
    if (window.IntersectionObserver) {
        new IntersectionObserver(entries => {
            const was = _onScreen;
            _onScreen = entries[entries.length - 1].isIntersecting;
            applyAnim();
            if (_onScreen && !was) loadDiagram();
        }).observe(document.getElementById("diagram-wrapper"));
    }
    applyAnim();
    </script>
</body>
</html>
