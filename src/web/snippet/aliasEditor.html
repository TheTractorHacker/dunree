<!DOCTYPE html>
<html>
    <head>
        <!-- Notes: This should be open in its original path-->
        <meta charset="utf-8">
        <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
        <link rel="stylesheet" href="../script/semantic/semantic.min.css">
        <link rel="stylesheet" href="../ui/zxui.css">
        <script src="../script/jquery-3.6.0.min.js"></script>
        <script src="../script/semantic/semantic.min.js"></script>
        <script src="../script/utils.js"></script>
        <style>
            html, body, body.darkTheme{ background: var(--theme_bg_primary, #fff) !important; }
            /* embedded in a card of the Edit site window: use the whole width of the frame (no fixed-width centred container) */
            .ui.container{ width: auto !important; max-width: none !important; margin: 0 !important; }
            body{ padding: 0 0 .4em; color: var(--zx-text); }
            .zx-table-wrap{ max-height: none; margin-bottom: var(--zx-space-4); }
            code{ background: var(--zx-surface-2); color: var(--zx-text); padding: 1px 5px; border-radius: var(--zx-radius-sm); }
            code.epname{ overflow-wrap: anywhere; } /* a long host name wraps instead of being cut at the frame edge */
            small{ color: var(--zx-text-muted); font-size: var(--zx-fs-sm); }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="../darktheme.css">
        <script src="../script/darktheme.js"></script>
        <div class="ui container">
            <!-- 
            <div class="ui header">
                <div class="content">
                    Alias Hostname
                    <div class="sub header epname"></div>
                </div>
            </div>
            <div class="ui divider"></div>-->
            <div class="scrolling content ui form">
                <div id="inlineEditBasicAuthCredentials" class="field">
                    <p class="zx-help" style="margin-bottom: var(--zx-space-3);">Other names or wildcard patterns that reach <code class="epname"></code></p>
                    <div class="zx-table-wrap zx-table-wrap--flush" tabindex="0" role="region" aria-label="Alias host names"><table class="zx-table zx-table--compact">
                        <thead>
                        <tr>
                            <th>Alias host name</th>
                            <th class="zx-actions">Remove</th>
                        </tr></thead>
                        <tbody id="inlineEditTable">
                        <tr>
                            <td colspan="2" class="zx-empty-cell">No alias host names yet</td>
                        </tr>
                        </tbody>
                    </table></div>
                    <div class="field">
                        <label>New alias host name</label>
                        <input id="aliasHostname" type="text" placeholder="alias.mydomain.com" autocomplete="off">
                        <small>Wildcards work, for example alias.mydomain.com or *.alias.mydomain.com</small>
                    </div>
                    <button class="zx-btn zx-btn--primary" onclick="addAliasToRoutingRule();"><i class="add icon"></i> Add alias</button>
                </div>
            </div>
        </div>
            
        <script>
            let aliasList = [];
            let editingEndpoint = {};

            if (window.location.hash.length > 1){
                let payloadHash = window.location.hash.substr(1);
                try{
                    payloadHash = JSON.parse(decodeURIComponent(payloadHash));
                    $(".epname").text(payloadHash.ep);
                    editingEndpoint = payloadHash;
                }catch(ex){
                    console.log("Unable to load endpoint data from hash")
                }
            }

            function initAliasNames(){
                $.cjax({
                    url: "/api/proxy/detail",
                    method: "POST",
                    data: {
                        "type":"host",
                        "epname": editingEndpoint.ep
                    },
                    success: function(data){
                        if (data.error != undefined){
                            //This endpoint not exists?
                            alert(data.error);
                            return;
                        }else{
                            $("#inlineEditTable").html("");
                            if (data.MatchingDomainAlias != undefined){
                                aliasList = data.MatchingDomainAlias;
                                renderAliasList();
                            }else{
                                //Assume no alias
                                $("#inlineEditTable").html(`<tr>
                                    <td colspan="2" class="zx-empty-cell">No alias host names yet</td>
                                </tr>`);
                            }

                            
                        }
                    }
                })
            }
            initAliasNames();

            function removeAliasDomain(targetDomain){
                aliasList.splice(aliasList.indexOf(targetDomain), 1);
                saveCurrentAliasList(function(data){
                    if (data.error != undefined){
                        parent.msgbox(data.error);
                    }else{
                        initAliasNames();
                        parent.msgbox("Alias hostname removed")
                    }
                });
            }

            function addAliasToRoutingRule(){
                let newAliasHostname = $("#aliasHostname").val().trim();
                aliasList.push(newAliasHostname);
                $("#aliasHostname").val("");
                saveCurrentAliasList(function(data){
                    if (data.error != undefined){
                        parent.msgbox(data.error);
                    }else{
                        parent.msgbox("New alias hostname added")
                        initAliasNames();
                    }
                    
                });
            }

            function saveCurrentAliasList(callback=undefined){
                $.cjax({
                    url: "/api/proxy/setAlias",
                    method: "POST",
                    data:{
                        "ep":editingEndpoint.ep,
                        "alias": JSON.stringify(aliasList)
                    },
                    success: function(data){
                        if (callback != undefined){
                            callback(data);
                        }

                        if (data.error == undefined && parent != undefined && parent.document != undefined){
                            //Try to update the parent object's rules if exists
                            parent.updateAliasListForEndpoint(editingEndpoint.ep, aliasList);
                        }
                    }
                })
            }

            function renderAliasList(){
                $("#inlineEditTable").html("");
                aliasList.forEach(aliasDomain => {
                    //alias names are user data: DOM calls only
                    let cell = $("<td></td>");
                    if (aliasDomain.includes("*")){
                        //This is a wildcard hostname
                        cell.text(aliasDomain);
                    }else{
                        cell.append($("<a target=\"_blank\" rel=\"noopener noreferrer\"></a>").attr("href", "//" + aliasDomain).text(aliasDomain));
                    }
                    let del = $('<button class="zx-btn zx-btn--danger-outline zx-btn--sm zx-btn--icon" aria-label="Remove alias" title="Remove alias"><i class="trash icon"></i></button>')
                        .on("click", function(){ removeAliasDomain(aliasDomain); });
                    $("#inlineEditTable").append($("<tr></tr>").append(cell).append($("<td class=\"zx-actions\"></td>").append(del)));
                });

                if (aliasList.length == 0){
                    $("#inlineEditTable").html(`<tr>
                        <td colspan="2" class="zx-empty-cell">No alias host names yet</td>
                    </tr>`);
                }
            }

            function closeThisWrapper(){
                parent.hideSideWrapper(true);
            }
        </script>
    </body>
</html>
