<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="zoraxy.csrf.Token" content="{{.csrfToken}}">
        <link rel="stylesheet" href="../script/semantic/semantic.min.css">
        <link rel="stylesheet" href="../ui/zxui.css">
        <script src="../script/jquery-3.6.0.min.js"></script>
        <script src="../script/semantic/semantic.min.js"></script>
        <script src="../script/utils.js"></script>
        <style>
            body{ background: var(--theme_bg_primary, var(--zx-surface)); color: var(--zx-text); padding: 0 0 var(--zx-space-3); }
            .zxs-wrap{ width: 100%; }
            .zxs-wrap .zx-table-wrap{ max-height: none; margin-bottom: var(--zx-space-4); }
            .zxs-wrap .ui.form .field{ margin-bottom: var(--zx-space-3); }
            .zxs-wrap .ui.horizontal.divider{ color: var(--zx-text-muted); }
            .zxs-wrap small{ color: var(--zx-text-muted); font-size: var(--zx-fs-sm); }
            .ui.circular.label.tag-color{
                min-width: 5px !important;
                min-height: 5px !important;
                margin-right: .4em;
                margin-bottom: -0.2em;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="../darktheme.css">
        <script src="../script/safestorage.js"></script>
        <script src="../script/darktheme.js"></script>
        <div class="zxs-wrap">
            <div class="zx-table-wrap zx-table-wrap--flush" tabindex="0" role="region" aria-label="Tags of this site">
                <table class="zx-table zx-table--compact">
                    <thead>
                        <tr>
                            <th>Tag</th>
                            <th class="zx-actions">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tagsTableBody">
                        <!-- Rows will be dynamically added here -->
                    </tbody>
                </table>
            </div>
            <p class="zx-help" style="margin-bottom: var(--zx-space-3);">Create a new tag, or add this site to an existing one.</p>
            <div class="ui form">
                <div class="field">
                    <label>New tags</label>
                    <input type="text" id="tagsInput" placeholder="e.g. mediaserver, management">
                </div>
                <button class="zx-btn zx-btn--primary" onclick="addSelectedTags();"><i class="plus icon"></i> Add tag</button>
                <div class="ui horizontal divider">
                Or
                </div>
                <div class="field">
                    <label>Join existing tags</label>
                    <div class="ui fluid multiple search selection dropdown" id="existingTagsDropdown">
                        <input type="hidden" id="existingTagsInput">
                        <i class="dropdown icon"></i>
                        <div class="default text">Select tags</div>
                        <div class="menu" id="existingTagsMenu">
                            <!-- Options will be dynamically added here -->
                        </div>
                    </div>
                    <small id="notagwarning" style="display:none;">All tags are already on this site</small>
                </div>
                <button class="zx-btn zx-btn--secondary" onclick="joinSelectedTagGroups();"><i class="plus icon"></i> Join tags</button>
            </div>
        </div>
        <script>
            let editingEndpoint = {};
            if (window.location.hash.length > 1){
                let payloadHash = window.location.hash.substr(1);
                try{
                    payloadHash = JSON.parse(decodeURIComponent(payloadHash));
                    $("#epname").text(payloadHash.ep);
                    editingEndpoint = payloadHash;
                    loadTags();
                }catch(ex){
                    console.log("Unable to load endpoint data from hash")
                }
            }

            function loadTags(){
                $.get("/api/proxy/detail", { type: "host", epname: editingEndpoint.ep }, function(data){
                    if (data.error == undefined){
                        //Render the tags to the table
                        $("#tagsTableBody").empty();
                        data.Tags.forEach(tag => {
                            addTagRow(tag);
                        });

                        if (data.Tags.length == 0){
                            appendNoTagNotice();
                        }
                    } else {
                        parent.msgbox(data.error, false);
                    }

                    //Populate the dropdown with all tags created in the system
                    populateTagsDropdown();
                });
            }

            //Append or remove a notice to the table when no tags are applied
            function appendNoTagNotice(){
                $("#tagsTableBody").append(`<tr class="notagNotice"><td colspan="2" class="zx-empty-cell">No tags on this site yet</td></tr>`);
            }

            function removeNoTagNotice(){
                $("#tagsTableBody .notagNotice").remove();
            }

            //Load all tags created in this system
            function loadAllCreatedTags(callback){
                $.get("/api/proxy/list?type=host", function(data){
                    if (data.error !== undefined){
                        //No existsing rule created yet. Fresh install?
                        callback([]);
                        return;
                    }
                    let tags = {};
                    data.forEach(host => {
                        host.Tags.forEach(tag => {
                            tags[tag] = true;
                        });
                    });

                    let uniqueTags = Object.keys(tags);
                    callback(uniqueTags);
                });
            }

            //Populate the dropdown with all tags created in the system
            function populateTagsDropdown(){
                loadAllCreatedTags(function(tags) {
                    let existingTags = new Set();
                    $('#tagsTableBody tr').each(function() {
                        existingTags.add($(this).attr('value'));
                    });
                    tags = tags.filter(tag => !existingTags.has(tag));
                    $('#existingTagsMenu').empty();
                    tags.forEach(tag => {
                        $('#existingTagsMenu').append($('<div class="item"></div>').attr('data-value', tag).text(tag)); //tags are user data
                    });
                    $('#existingTagsDropdown').dropdown();

                    if (tags.length == 0){
                        $('#notagwarning').show();
                    }else{
                        $('#notagwarning').hide();
                    }
                });
            }
            
            function tagAlreadyExistsInTable(tag) {
                return $('#tagsTableBody .tagEntry').filter(function(){ return $(this).attr('value') === tag; }).length > 0;
            }

            function addSelectedTags() {
                let tags = $('#tagsInput').val().split(',').map(tag => tag.trim());
                if (tags.length == 0 || (tags.length == 1 && tags[0] == "")){
                    parent.msgbox("Please enter at least one tag", false);
                    return;
                }
                tags.forEach(tag => {
                    if (tag && !tagAlreadyExistsInTable(tag)) {
                        addTagRow(tag);
                    }
                });
                console.log(tags);
                populateTagsDropdown();
                $('#tagsInput').val('');
                saveTags();
            }

            function joinSelectedTagGroups() {
                if ($('#existingTagsInput').val() == ""){
                    parent.msgbox("Please select at least one tag group to join", false);
                    return;
                }
                let selectedTags = $('#existingTagsInput').val().split(',');
                selectedTags.forEach(tag => {
                    if (tag && !tagAlreadyExistsInTable(tag)) {
                        addTagRow(tag);
                    }
                });
                populateTagsDropdown();
                $('#existingTagsDropdown').dropdown('clear');
                saveTags();
            }
            

             // Function to generate a color based on a tag name
            function getTagColorByName(tagName) {
                function hashCode(str) {
                    return str.split('').reduce((prevHash, currVal) =>
                        ((prevHash << 5) - prevHash) + currVal.charCodeAt(0), 0);
                }
                let hash = hashCode(tagName);
                let color = '#' + ((hash >> 24) & 0xFF).toString(16).padStart(2, '0') +
                                    ((hash >> 16) & 0xFF).toString(16).padStart(2, '0') +
                                    ((hash >> 8) & 0xFF).toString(16).padStart(2, '0');
                return color;
            }

            //Add a tag row to the table
            function addTagRow(tag) {
                //tags are user data: build the row with DOM calls, never with string templates
                const row = $('<tr class="tagEntry"></tr>').attr('value', tag);
                const first = $('<td></td>').append($('<div class="ui circular label tag-color"></div>').css('background-color', getTagColorByName(tag)))
                    .append(document.createTextNode(' ' + tag));
                const del = $('<button class="zx-btn zx-btn--danger-outline zx-btn--sm"><i class="trash icon"></i> Delete</button>').attr('title', 'Delete Tag')
                    .on('click', function(){ removeTag(tag); });
                row.append(first).append($('<td></td>').append(del));
                $("#tagsTableBody").append(row);
                removeNoTagNotice();
            }

            function removeTag(tag) {
                $('#tagsTableBody .tagEntry').filter(function(){ return $(this).attr('value') === tag; }).remove();
                populateTagsDropdown();
                saveTags();

                if ($('#tagsTableBody tr').length == 0){
                    appendNoTagNotice();
                }
            }

            function saveTags(){
                let tags = [];
                $('#tagsTableBody tr').each(function() {
                    tags.push($(this).attr('value'));
                });
                console.log(tags);
                $.cjax({
                    url: "/api/proxy/setTags",
                    method: "POST",
                    data: {
                        rootname: editingEndpoint.ep,
                        tags: tags.join(",")
                    },
                    success: function(data){
                        if (data.error != undefined){
                            parent.msgbox(data.error, false);
                        } else {
                            parent.msgbox("Tags updated");
                            //Update the preview on parent page
                            parent.renderTagsPreview(editingEndpoint.ep, tags);
                            //parent.hideSideWrapper();
                        }
                    }
                });
            }
        </script>
    </body>
</html>
