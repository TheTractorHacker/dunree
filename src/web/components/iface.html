<div class="standardContainer">
    <header class="zx-page-header">
        <div class="zx-page-header__main">
            <div class="zx-page-header__crumbs" data-zx-crumbs></div>
            <h2 class="zx-page-header__title">Network interfaces</h2>
            <p class="zx-page-header__sub">The network cards and addresses of this machine.</p>
        </div>
        <div class="zx-page-header__actions">
            <button class="zx-btn zx-btn--secondary" type="button" onclick="renderNICInfo(); msgbox('NIC information reloaded');"><i class="sync icon"></i> Refresh</button>
        </div>
    </header>
    <section class="zx-card" aria-labelledby="nicTitle">
        <div class="zx-card__head">
            <h3 class="zx-card__title" id="nicTitle">Installed network cards</h3>
            <p class="zx-card__desc">Each interface with the addresses it currently has.</p>
        </div>
        <div class="zx-card__body"><div class="zx-table-wrap zx-table-wrap--flush" tabindex="0" role="region" aria-label="Network interfaces">
            <table id="network-interfaces-table" class="zx-table">
                <thead>
                    <tr>
                        <th>Interface name</th>
                        <th>IP addresses</th>
                        <th class="zx-num">ID</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td class="zx-empty-cell" colspan="3">Loading...</td></tr>
                </tbody>
            </table>
        </div></div>
    </section>
</div>
<script>
/*
    NIC Info
*/
function renderNICInfo(){
    $.get("/api/stats/listnic",function(data){
        var tbody = document.querySelector("#network-interfaces-table tbody");
        tbody.innerHTML = ""; // Clear existing rows
        if (!Array.isArray(data) || data.length == 0){
            var er = document.createElement("tr"), ec = document.createElement("td");
            ec.className = "zx-empty-cell"; ec.colSpan = 3; ec.textContent = "No network interfaces were found on this machine.";
            er.appendChild(ec); tbody.appendChild(er);
            return;
        }
        data.forEach(function(item) {
            var tr = document.createElement("tr");
            var name = document.createElement("td");
            name.setAttribute("data-label", "Interface name");
            name.textContent = item.Name;
            var id = document.createElement("td");
            id.className = "zx-num";
            id.setAttribute("data-label", "ID");
            id.textContent = item.ID;
            var ips = document.createElement("td");
            ips.setAttribute("data-label", "IP addresses");
            if (item.IPs == null || item.IPs.length == 0){
                var nc = document.createElement("span");
                nc.className = "zx-badge";
                nc.textContent = "Not connected";
                ips.appendChild(nc);
            }else{
                item.IPs.forEach(function(ip){
                    var line = document.createElement("div");
                    line.className = "zx-mono";
                    line.textContent = ip;
                    ips.appendChild(line);
                });
            }

            tr.appendChild(name);
            tr.appendChild(ips);
            tr.appendChild(id);
            tbody.appendChild(tr);
        });
    }).fail(function(){
        var tbody = document.querySelector("#network-interfaces-table tbody");
        tbody.innerHTML = "";
        var er = document.createElement("tr"), ec = document.createElement("td");
        ec.className = "zx-empty-cell"; ec.colSpan = 3; ec.textContent = "The list could not be loaded. Press Refresh to try again.";
        er.appendChild(ec); tbody.appendChild(er);
    });
}
renderNICInfo();

</script>
