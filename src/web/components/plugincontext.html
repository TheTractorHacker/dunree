<div class="">
    <iframe id="pluginContextLoader" title="Plugin" style="width: 100%; border: none;">
    
    </iframe>
</div>
<script>
    function initPluginUIView(forceOverwritePluginID = undefined){
        if (typeof(forceOverwritePluginID) != "undefined"){
            let pluginID = forceOverwritePluginID;
            console.log("Launching plugin UI for plugin with ID:", pluginID);
            loadPluginContext(pluginID);
            return;
        }
        let pluginID = getPluginIDFromWindowHash();
        if (pluginID == ""){
            return;
        }
        console.log("Launching plugin UI for plugin with ID:", pluginID);
        loadPluginContext(pluginID);
    }

    function loadPluginContext(pluginID){
        //Zoraxy says where the page of the plugin is. Default: under this origin, as always.
        //With "Isolate plugin pages" (Plugin Manager, plugin safety settings): on an address of
        //its own, in a sandbox without allow-same-origin, so the page has no part in the admin session.
        let frame = $("#pluginContextLoader");
        frame.attr("data-plugin", pluginID).attr("data-isolated", "");
        $.cjax({
            url: "/api/plugins/ui/ticket",
            type: "POST",
            data: {plugin_id: pluginID},
            success: function(resp){
                if (frame.attr("data-plugin") != pluginID){
                    return; //another plugin was opened in the meantime
                }
                if (!resp || resp.error != undefined || !resp.url){
                    showPluginContextError((resp && resp.error) || t("The page of the plugin could not be opened."));
                    return;
                }
                guardPluginFrameWindow(!!resp.isolated);
                //the sandbox is applied only when a plugin page is really opened, so the browser does not warn about it on every page load
                frame.attr("data-isolated", resp.isolated ? "true" : "false")
                    .attr("sandbox", resp.sandbox || (resp.isolated ? "allow-scripts allow-forms" : "allow-scripts allow-same-origin"))
                    .removeAttr("srcdoc")
                    .attr("src", resp.url);
            },
            error: function(){
                if (frame.attr("data-plugin") == pluginID){
                    showPluginContextError(t("The page of the plugin could not be opened."));
                }
            }
        });
    }

    //The admin page calls contentWindow.setDarkTheme() of this frame when the theme changes. The window of an
    //isolated page belongs to another origin: touching it throws. Give such a frame a stand-in that does nothing.
    function guardPluginFrameWindow(isolated){
        let el = document.getElementById("pluginContextLoader");
        if (isolated){
            Object.defineProperty(el, "contentWindow", {configurable: true, get: function(){ return {setDarkTheme: function(){}}; }});
        } else {
            delete el.contentWindow;
        }
    }

    function showPluginContextError(message){
        let esc = $("<div>").text(message).html();
        $("#pluginContextLoader").attr("sandbox", "").removeAttr("src")
            .attr("srcdoc", '<!doctype html><meta charset="utf-8"><meta name="color-scheme" content="light dark"><body style="font-family:system-ui,sans-serif;padding:2rem;line-height:1.5"><p role="alert">' + esc + '</p></body>');
    }

    function getPluginIDFromWindowHash(){
        let tabID = window.location.hash.substr(1);
        let pluginID = "";
        if (tabID.startsWith("{")) {
            tabID = decodeURIComponent(tabID);
            try {
                let parsedData = JSON.parse(tabID);
                if (typeof(parsedData.pluginID) != "undefined"){
                    pluginID = parsedData.pluginID;
                }
            } catch (e) {
                console.error("Invalid JSON data:", e);
            }
        }
        return pluginID;
    }

    function resizeIframe() {
        let iframe = document.getElementById('pluginContextLoader');
        let mainMenuHeight = document.getElementById('mainmenu').offsetHeight;
        //Size to the taller of the sidebar and the viewport so the iframe
        //fills the window on tall browsers instead of leaving a footer gap
        iframe.style.height = Math.max(mainMenuHeight, window.innerHeight - 198) + 'px';
    }

    $(window).on("resize", function(){
        resizeIframe();
    });

    //Bind event to tab switch
    tabSwitchEventBind["pluginContextWindow"] = function(){
        //On switch over to this page, load info
        resizeIframe();
    }
</script>
